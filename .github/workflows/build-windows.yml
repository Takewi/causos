name: Build Windows Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPORT_NAME: causos

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Export Directory
        run: |
          mkdir -v -p build/windows

      - name: Export Project for Windows Desktop
        run: |
          godot --headless --verbose --export-release "Windows Desktop" build/windows/${{ env.EXPORT_NAME }}.exe

      - name: Compress Release Archive
        run: |
          cd build/windows
          zip -r ../../${{ env.EXPORT_NAME }}-windows-x86_64.zip .
          cd ../..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: causos-windows-x86_64
          path: ${{ env.EXPORT_NAME }}-windows-x86_64.zip
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.EXPORT_NAME }}-windows-x86_64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

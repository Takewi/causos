name: Build Multiplatform Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPORT_NAME: causos

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            preset: "Windows Desktop"
            dir: build/windows
            output: causos.exe
            artifact: causos-windows-x86_64
          - name: Linux
            preset: "Linux/X11"
            dir: build/linux
            output: causos.x86_64
            artifact: causos-linux-x86_64
          - name: macOS
            preset: "macOS"
            dir: build/macos
            output: causos-macos.zip
            artifact: causos-macos-universal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          cp -rf /root/.config/godot ~/.config/godot 2>/dev/null || true
          cp -rf /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/

      - name: Setup Export Directory
        run: |
          mkdir -v -p ${{ matrix.platform.dir }}

      - name: Export Project
        run: |
          EXPORT_DIR="$(readlink -f ${{ matrix.platform.dir }})"
          godot --headless --verbose --export-release "${{ matrix.platform.preset }}" "$EXPORT_DIR/${{ matrix.platform.output }}"

      - name: Post-Process Linux Binary
        if: matrix.platform.name == 'Linux'
        run: |
          chmod +x ${{ matrix.platform.dir }}/${{ matrix.platform.output }}

      # O bundle .app NAO e descompactado aqui de proposito: actions/upload-artifact
      # reempacota o conteudo e descarta as permissoes POSIX, zerando o bit +x de
      # Contents/MacOS/causos. O macOS entao recusa abrir o app (erro -10810).
      # Mantendo o .zip do Godot intacto, modos e assinatura adhoc sobrevivem.

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: ${{ matrix.platform.dir }}/
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version & Tag
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            git fetch --tags --force 2>/dev/null || true
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v0.3.0"
            fi

            RAW_VER="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VER"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-3}
            PATCH=${PATCH:-0}

            # If any commit since latest tag is a feature or breaking change, bump minor; otherwise bump patch
            COMMITS_LOG=$(git log "${LATEST_TAG}..HEAD" --oneline 2>/dev/null || git log -n 10 --oneline)
            if echo "$COMMITS_LOG" | grep -iqE '(^| )feat(\(.*\))?:|breaking'; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            TAG="v${MAJOR}.${MINOR}.${PATCH}"

            # Guarantee tag uniqueness in case of race or existing tag
            while git rev-parse "$TAG" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            done
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Determined release tag: $TAG"

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: causos-windows-x86_64
          path: release-assets/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: causos-linux-x86_64
          path: release-assets/linux

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: causos-macos-universal
          path: release-assets/macos

      - name: Package Release Archives
        run: |
          mkdir -p release-files

          # Windows .zip
          cd release-assets/windows
          zip -r ../../release-files/${{ env.EXPORT_NAME }}-windows-x86_64.zip .
          cd ../..

          # Linux .tar.gz and .zip
          chmod +x release-assets/linux/${{ env.EXPORT_NAME }}.x86_64
          cd release-assets/linux
          tar -czvf ../../release-files/${{ env.EXPORT_NAME }}-linux-x86_64.tar.gz .
          zip -r ../../release-files/${{ env.EXPORT_NAME }}-linux-x86_64.zip .
          cd ../..

          # macOS: reaproveita o .zip gerado pelo Godot sem reempacotar.
          # Reempacotar aqui perderia o bit de execucao de Contents/MacOS/causos,
          # que actions/upload-artifact nao preserva.
          cp release-assets/macos/${{ env.EXPORT_NAME }}-macos.zip \
             release-files/${{ env.EXPORT_NAME }}-macos.zip

          echo "=== Built Release Files ==="
          ls -lh release-files/

      - name: Verify macOS Executable Bit
        run: |
          ENTRY=$(unzip -Z release-files/${{ env.EXPORT_NAME }}-macos.zip \
            "*.app/Contents/MacOS/*" | grep -v '/$')
          echo "$ENTRY"
          if ! echo "$ENTRY" | grep -q '^-rwx'; then
            echo "::error::O binario em Contents/MacOS perdeu o bit de execucao; o app nao abriria no macOS."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ${{ steps.versioning.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
